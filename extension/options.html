<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Intake AI Agent — Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-top: 16px; }
    input { width: 100%; padding: 8px; font-size: 13px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; }
    #status.saved { color: #1a7f37; }
    #status.error { color: #c00; }
    p.hint { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>Intake AI Agent — Settings</h1>
  <p class="hint">
    Enter your Groq API key below (get one at
    <a href="https://console.groq.com" target="_blank">console.groq.com</a>).
  </p>

  <label for="groqKey">Groq API Key</label>
  <input type="password" id="groqKey" placeholder="gsk_..." autocomplete="off" />
  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
